
Interrupts:
    buttons : |
        | name         | type      | scenarios         |
        | inters_lit   | principal | allumer, eteindre |
        | inter_porte1 | principal | allumer, eteindre |
        | inter_porte2 | principal | change_mode       |

HTML:
    - name: home.lumières.chambre
      type: button
      background_image: night.png
      inactive_color: grey
      active_color: black
      action:
          type: button
          button: principal
          scenarios: blanc, eteindre

Scenarios:

    - name: change_mode
      marker: NONE
      instructions: |
          | name    | type | delay | duration | args |
          | coucher | mode | 0     | 0        | True |


    - name: allumer
      marker: ON
      instructions: |
          | name        | type  | delay | duration | args            |
          | led_plafond | color | 0     | 5        | 80,color        |
          | led_lit     | color | 0     | 5        | 100,color2      |
          | panneau_led | rgbw  | 0     | 5        | 95,color2, 0x10 |

    - name: deco
      marker: DECO
      instructions: |
          | name        | type  | delay | duration | args            |
          | led_plafond | color | 0     | 5        | 20,color        |
          | led_lit     | color | 0     | 5        | 80,color2       |
          | panneau_led | rgbw  | 0     | 5        | 10,color2, 0x10 |

    - name: blanc
      marker: ON
      instructions: |
          | name        | type  | delay | duration | args            |
          | led_plafond | color | 0     | 5        | 0,0x000000        |
          | led_lit     | color | 0     | 5        | 0,0x000000       |
          | panneau_led | rgbw  | 0     | 5        | 100,0x000000, 0xff |



    - name: eteindre
      marker: OFF
      instructions: |
          | name        | type  | delay | duration | args       |
          | led_plafond | color | 0     | 5       | 0,0x000000 |
          | led_lit     | color | 0     | 5       | 0,0x000000 |
          | panneau_led | rgbw  | 0     | 10       | 0,0x000000, 0x00 |

